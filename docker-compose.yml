services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openresend-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openresend}:${POSTGRES_PASSWORD:-change_me_in_production}@postgres:5432/${POSTGRES_DB:-openresend_db}?schema=public
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openresend-network

  postgres:
    image: postgres:16-alpine
    container_name: openresend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openresend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-openresend_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openresend} -d ${POSTGRES_DB:-openresend_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openresend-network

networks:
  openresend-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
